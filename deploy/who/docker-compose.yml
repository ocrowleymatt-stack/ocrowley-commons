# Private WHO deploy — Node API/UI + BigBrother bridge sidecar
# From repo root:
#   cp deploy/who/.env.example deploy/who/.env   # edit secrets
#   docker compose -f deploy/who/docker-compose.yml --env-file deploy/who/.env up -d --build
#
# BigBrother shares WHO's network namespace (localhost:8798) so it is never
# published on the host and works even when bridge inter-container routing is broken.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OCROWLEY_PG_USER:-who}
      POSTGRES_PASSWORD: ${OCROWLEY_PG_PASSWORD:-who_dev}
      POSTGRES_DB: ${OCROWLEY_PG_DB:-who}
    volumes:
      - who-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OCROWLEY_PG_USER:-who} -d ${OCROWLEY_PG_DB:-who}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  who:
    build:
      context: ../..
      dockerfile: deploy/who/Dockerfile
      target: who
    restart: unless-stopped
    ports:
      - "${OCROWLEY_WHO_PUBLISH_PORT:-8787}:8787"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      OCROWLEY_WHO_HOST: "0.0.0.0"
      OCROWLEY_WHO_PORT: "8787"
      OCROWLEY_DATA_DIR: /data
      OCROWLEY_BB_AUTOSTART: "0"
      OCROWLEY_BIGBROTHER_BRIDGE: http://127.0.0.1:8798
      # Phase 4 — dossiers/entities in Postgres (JSON fallback if unset)
      DATABASE_URL: ${DATABASE_URL:-postgres://who:who_dev@db:5432/who}
      OCROWLEY_WHO_DUAL_WRITE: ${OCROWLEY_WHO_DUAL_WRITE:-0}
      OCROWLEY_SPIDERDASH_URL: ${OCROWLEY_SPIDERDASH_URL:-https://spiderdash-mbpjlxnq.manus.space}
      OCROWLEY_SPIDERFOOT_URL: ${OCROWLEY_SPIDERFOOT_URL:-http://165.227.237.155:5001}
      OCROWLEY_OSINT_CASE: ${OCROWLEY_OSINT_CASE:?set OCROWLEY_OSINT_CASE in deploy/who/.env}
      OCROWLEY_WHO_PIN: ${OCROWLEY_WHO_PIN:-3123}
      OCROWLEY_WHO_AUTH: ${OCROWLEY_WHO_AUTH:-pin}
      OCROWLEY_WHO_BOOTSTRAP_TOKEN: ${OCROWLEY_WHO_BOOTSTRAP_TOKEN:-}
      OCROWLEY_OSINT_DEEP: ${OCROWLEY_OSINT_DEEP:-1}
      OCROWLEY_BRIDGE_TIMEOUT_MS: ${OCROWLEY_BRIDGE_TIMEOUT_MS:-180000}
      # In-process async job worker for POST /api/who/jobs (set 0 to disable).
      OCROWLEY_WHO_WORKER: ${OCROWLEY_WHO_WORKER:-1}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      DEHASHED_API_KEY: ${DEHASHED_API_KEY:-}
      DEHASHED_EMAIL: ${DEHASHED_EMAIL:-}
      INTELX_API_KEY: ${INTELX_API_KEY:-}
      OCROWLEY_ENABLE_CLI_TOOLS: ${OCROWLEY_ENABLE_CLI_TOOLS:-0}
    volumes:
      - who-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  bb:
    build:
      context: ../..
      dockerfile: deploy/who/Dockerfile
      target: bb
    restart: unless-stopped
    network_mode: "service:who"
    depends_on:
      who:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8798/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  who-data:
  who-pg:
