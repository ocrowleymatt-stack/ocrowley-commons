[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrowley_search"
version = "0.1.0"
description = "Personal search planner heuristics (from Life)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocrowley_search*"]
