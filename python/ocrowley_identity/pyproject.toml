[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrowley_identity"
version = "0.1.0"
description = "Deterministic identity normalisation (from Life)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocrowley_identity*"]
