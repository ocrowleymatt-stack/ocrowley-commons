[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrowley-osint"
version = "0.1.0"
description = "OSINT module registry and scan contracts for ocrowley-commons"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
ocrowley-bb-bridge = "ocrowley_osint.http_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocrowley_osint*"]
